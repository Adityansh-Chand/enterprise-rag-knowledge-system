name: CI

on:
  push:
  pull_request:

jobs:
  test-and-evaluate:
    name: Test and evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The CPU wheel first, otherwise pip resolves the CUDA build (~2GB) for a
      # workload that never touches a GPU.
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Prove the committed corpus and reranker are reproducible rather than
      # trusting the files in the repo.
      - name: Corpus is reproducible
        run: python training/generate_corpus.py --check
      - name: Reranker artifact is reproducible
        run: python training/train_reranker.py --verify --retriever bm25

      - name: Generation eval set is reproducible
        run: python training/generate_generation_eval.py --check

      # bm25 only: the dense thresholds in the same artifact were fitted with
      # the embedding model, which CI does not download.
      - name: Abstention threshold is reproducible
        run: python training/calibrate_abstention.py --retriever bm25 --verify

      - name: Run tests
        run: python -m pytest -q

      # The offline synthetic bench only. BEIR subsets are downloaded on demand
      # and are not part of CI -- see the README for how to reproduce those.
      - name: Retrieval bench (offline corpus)
        run: python evaluation/harness.py --retrievers bm25,lsa --no-save

      # Answer quality, as opposed to ranking quality. Runs on the extractive
      # path with no API key and no spend -- the LLM path scores on the same
      # metrics but is not what any reported number comes from.
      - name: Generation bench (offline corpus)
        run: python evaluation/generation_bench.py --retrievers bm25 --no-save

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build --file Dockerfile --tag enterprise-rag:${{ github.sha }} .
